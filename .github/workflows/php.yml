name: JSON Serializer CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  testsuite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # This fork (dev-php84) requires PHP ^8.4 in composer.json; testing older
        # versions only ever failed `composer install` on the platform requirement.
        php-version: ['8.4']
    name: PHP ${{ matrix.php-version }}
    steps:
    - uses: actions/checkout@v4
    - name: Validate composer.json and composer.lock
      run: composer validate
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-
    - name: Install suggested dependencies
      run: composer require jeremeamia/superclosure opis/closure
    - name: Install dependencies
      if: steps.composer-cache.outputs.cache-hit != 'true'
      run: composer install --prefer-dist --no-progress --no-suggest
    - name: Run test suite
      run: vendor/bin/phpunit
